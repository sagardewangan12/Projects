# Prometheus configuration for Linux Fleet Monitoring with Prometheus and Grafana.
# This project intentionally uses static_configs so beginners can see exactly
# which Linux hosts are being monitored. Replace the example IP addresses with
# your real server IPs before starting Prometheus.

global:
  scrape_interval: 15s      # How often Prometheus collects metrics.
  evaluation_interval: 15s  # How often Prometheus evaluates alert rules.
  scrape_timeout: 10s

# Prometheus can scrape its own metrics. This helps confirm Prometheus is alive.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          role: monitoring

  # Linux fleet monitored by Node Exporter.
  # Node Exporter listens on TCP port 9100 by default.
  - job_name: linux-fleet
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - 192.168.10.11:9100
        labels:
          hostname: linux-node-01
          environment: production
      - targets:
          - 192.168.10.12:9100
        labels:
          hostname: linux-node-02
          environment: production
      - targets:
          - 192.168.10.13:9100
        labels:
          hostname: linux-node-03
          environment: production
      - targets:
          - 192.168.10.14:9100
        labels:
          hostname: linux-node-04
          environment: production
      - targets:
          - 192.168.10.15:9100
        labels:
          hostname: linux-node-05
          environment: production
      - targets:
          - 192.168.10.16:9100
        labels:
          hostname: linux-node-06
          environment: production
      - targets:
          - 192.168.10.17:9100
        labels:
          hostname: linux-node-07
          environment: production
      - targets:
          - 192.168.10.18:9100
        labels:
          hostname: linux-node-08
          environment: production
      - targets:
          - 192.168.10.19:9100
        labels:
          hostname: linux-node-09
          environment: production
      - targets:
          - 192.168.10.20:9100
        labels:
          hostname: linux-node-10
          environment: production

      # To add more Linux servers later, copy this block, change the IP address,
      # and choose a unique hostname label. Then restart Prometheus.
      # - targets:
      #     - 192.168.10.21:9100
      #   labels:
      #     hostname: linux-node-11
      #     environment: production
