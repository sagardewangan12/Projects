apiVersion: 1

groups:
  - orgId: 1
    name: Linux Fleet Critical Alerts
    folder: Linux Fleet Monitoring
    interval: 1m
    rules:
      - uid: linux_host_cpu_above_80
        title: Linux Host CPU Usage Above 80%
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Linux host CPU usage is above 80% for 5 minutes.
          description: '{{ $labels.hostname }} CPU usage is above 80%. Check running processes and system load.'
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 100 * (1 - avg by (instance, hostname) (rate(node_cpu_seconds_total{job="linux-fleet",mode="idle"}[5m])))
              instant: true
              range: false
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
